name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm install && pip install sgp4 numpy scipy
      - name: SGP4 against Vallado's verification set
        run: node test/sgp4.js
      - name: Screening against an independent brute-force screen
        run: python3 test/screen_check.py
      - name: Page builds from source
        run: python3 build.py
